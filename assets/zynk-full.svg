<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="full-cyan" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="full-violet" x1="60" y1="60" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="full-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <filter id="full-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Icon Mark (Scaled & Offset) -->
  <g transform="translate(10, 10) scale(0.5)" filter="url(#full-shadow)">
    <!-- Lower Ribbon -->
    <path d="M 92 88 C 92 93.52 87.52 98 82 98 L 38 98 C 30.27 98 25.1 90.6 27.8 83.4 L 42.4 44.5 C 43.8 40.7 47.5 38.2 51.6 38.2 L 60.5 38.2 C 65.5 38.2 69.2 43.1 67.5 47.8 L 54.8 82 L 82 82 C 87.52 82 92 84.68 92 88 Z" fill="url(#full-violet)" />
    <!-- Upper Ribbon -->
    <path d="M 28 32 C 28 26.48 32.48 22 38 22 L 82 22 C 89.73 22 94.9 29.4 92.2 36.6 L 77.6 75.5 C 76.2 79.3 72.5 81.8 68.4 81.8 L 59.5 81.8 C 54.5 81.8 50.8 76.9 52.5 72.2 L 65.2 38 L 38 38 C 32.48 38 28 35.32 28 32 Z" fill="url(#full-cyan)" />
    <!-- Center Node -->
    <circle cx="60" cy="60" r="5" fill="#38BDF8" />
    <circle cx="60" cy="60" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Typography: Zynk -->
  <text x="82" y="49" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="url(#full-text-grad)">
    Zynk<tspan fill="#2563EB">.</tspan>
  </text>

  <!-- Subtitle Tag / Badge -->
  <rect x="83" y="56" width="94" height="15" rx="4" fill="#EFF6FF" />
  <text x="88" y="67" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.1em" fill="#2563EB">
    SHOWCASE HUB
  </text>
  
  <text x="186" y="67" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" letter-spacing="0.02em" fill="#64748B">
    by Haf
  </text>
</svg>
