<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Cyan to Electric Blue Gradient -->
    <linearGradient id="zynk-grad-cyan-blue" x1="20" y1="20" x2="90" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Electric Blue to Violet Gradient -->
    <linearGradient id="zynk-grad-blue-violet" x1="100" y1="100" x2="30" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Accent Sync Glow Gradient -->
    <linearGradient id="zynk-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="zynk-depth-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.28" />
    </filter>

    <!-- Ambient Glow for Sync Node -->
    <filter id="zynk-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Group with Depth Filter -->
  <g filter="url(#zynk-depth-shadow)">
    <!-- Lower Ribbon: Violet to Blue, sweeps from bottom-right (94, 88) across to (36, 88) and up the diagonal to (66, 42) -->
    <path d="M 92 88 C 92 93.52 87.52 98 82 98 L 38 98 C 30.27 98 25.1 90.6 27.8 83.4 L 42.4 44.5 C 43.8 40.7 47.5 38.2 51.6 38.2 L 60.5 38.2 C 65.5 38.2 69.2 43.1 67.5 47.8 L 54.8 82 L 82 82 C 87.52 82 92 84.68 92 88 Z" fill="url(#zynk-grad-blue-violet)" />

    <!-- Upper Ribbon: Cyan to Blue, sweeps from top-left (28, 32) across to (82, 32) and down the diagonal to (54, 78) -->
    <path d="M 28 32 C 28 26.48 32.48 22 38 22 L 82 22 C 89.73 22 94.9 29.4 92.2 36.6 L 77.6 75.5 C 76.2 79.3 72.5 81.8 68.4 81.8 L 59.5 81.8 C 54.5 81.8 50.8 76.9 52.5 72.2 L 65.2 38 L 38 38 C 32.48 38 28 35.32 28 32 Z" fill="url(#zynk-grad-cyan-blue)" />

    <!-- Central Interlocking Sync Core (Data sync pulse) -->
    <circle cx="60" cy="60" r="6" fill="url(#zynk-grad-accent)" filter="url(#zynk-glow)" />
    <circle cx="60" cy="60" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
