<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#F0F7FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Outer Shadow for App Icon -->
    <filter id="app-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3B82F6" flood-opacity="0.12" />
    </filter>

    <!-- Zynk Gradients -->
    <linearGradient id="zynk-grad-cyan" x1="24" y1="26" x2="94" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="zynk-grad-violet" x1="104" y1="102" x2="34" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="zynk-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="node-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle with Shadow & Frosted Glass -->
  <g filter="url(#app-shadow)">
    <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
    
    <!-- Subtle Inner Top Specular Highlight -->
    <rect x="10" y="10" width="108" height="54" rx="26" fill="white" fill-opacity="0.25" />
    
    <!-- Ambient Inner Glow Blobs -->
    <circle cx="96" cy="32" r="26" fill="#38BDF8" fill-opacity="0.15" filter="blur(16px)" />
    <circle cx="32" cy="96" r="26" fill="#818CF8" fill-opacity="0.18" filter="blur(16px)" />

    <!-- Zynk Glyph Core (Centered in 128x128 space) -->
    <g transform="translate(4, 4)">
      <!-- Lower Ribbon -->
      <path d="M 92 88 C 92 93.52 87.52 98 82 98 L 38 98 C 30.27 98 25.1 90.6 27.8 83.4 L 42.4 44.5 C 43.8 40.7 47.5 38.2 51.6 38.2 L 60.5 38.2 C 65.5 38.2 69.2 43.1 67.5 47.8 L 54.8 82 L 82 82 C 87.52 82 92 84.68 92 88 Z" fill="url(#zynk-grad-violet)" />

      <!-- Upper Ribbon -->
      <path d="M 28 32 C 28 26.48 32.48 22 38 22 L 82 22 C 89.73 22 94.9 29.4 92.2 36.6 L 77.6 75.5 C 76.2 79.3 72.5 81.8 68.4 81.8 L 59.5 81.8 C 54.5 81.8 50.8 76.9 52.5 72.2 L 65.2 38 L 38 38 C 32.48 38 28 35.32 28 32 Z" fill="url(#zynk-grad-cyan)" />

      <!-- Central Sync Spark -->
      <circle cx="60" cy="60" r="5.5" fill="url(#zynk-pulse)" filter="url(#node-glow)" />
      <circle cx="60" cy="60" r="2.2" fill="#FFFFFF" />
    </g>
  </g>
</svg>
